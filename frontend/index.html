<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lacinka</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="window" data-theme="light">
    <header class="titlebar">
      <div class="brand">
        <div class="brand-mark"></div>
        <div class="brand-text">
          <div class="brand-title">Łacinka</div>
          <div class="brand-subtitle">希腊/塞克西里尔/谚文/白罗斯西里尔</div>
        </div>
      </div>

      <div class="header-status">
        <span class="status-dot"></span>
        <span id="status-text">等待输入</span>
      </div>

      <div class="title-actions">
        <button id="theme-toggle" class="text-button" type="button">深色</button>
        <label class="pin-toggle">
          <input id="always-on-top" type="checkbox">
          <span>置顶</span>
        </label>
        <button id="clear-all" class="text-button danger-hover" type="button">清空</button>
        <button id="btn-minimize" class="icon-button" type="button" aria-label="最小化">_</button>
        <button id="btn-close" class="icon-button danger" type="button" aria-label="关闭">×</button>
      </div>
    </header>

    <main class="workspace">
      <section class="text-panel input-panel">
        <div class="panel-head">
          <div>
            <span class="eyebrow">输入</span>
            <h1>待转写内容</h1>
          </div>
          <span id="input-count" class="count">0 字符</span>
        </div>
        <textarea id="input-text" spellcheck="false" placeholder="在此输入待转写内容..."></textarea>
        <div class="meter" aria-hidden="true"><span id="input-meter"></span></div>
        <div class="chips">
          <button class="chip" type="button" data-sample="0">希腊语希腊示例</button>
          <button class="chip" type="button" data-sample="1">塞克语西里尔示例</button>
          <button class="chip" type="button" data-sample="2">朝鲜语谚文示例</button>
          <button class="chip" type="button" data-sample="3">白罗斯语西里尔示例</button>
          <button class="chip" type="button" data-sample="4">白罗斯语西里尔示例</button>
        </div>
      </section>

      <section class="control-panel">
        <div class="mode-stack" role="radiogroup" aria-label="转写类型">
          <button class="mode-card active" type="button" data-mode="0" data-accent="blue">
            <span class="mode-name">希腊->拉丁</span>
            <span class="mode-desc">希腊字母转写</span>
          </button>
          <button class="mode-card" type="button" data-mode="1" data-accent="green">
            <span class="mode-name">塞克西里尔->拉丁</span>
            <span class="mode-desc">西里尔字母转写</span>
          </button>
          <button class="mode-card" type="button" data-mode="2" data-accent="rose">
            <span class="mode-name">谚文->拉丁</span>
            <span class="mode-desc">谚文罗马音</span>
          </button>
          <button class="mode-card" type="button" data-mode="3" data-accent="amber">
            <span class="mode-name">白罗斯西里尔->拉丁(Łacinka)</span>
            <span class="mode-desc">西里尔字母转写</span>
          </button>
          <button class="mode-card" type="button" data-mode="4" data-accent="violet">
            <span class="mode-name">白罗斯西里尔->拉丁(2007)</span>
            <span class="mode-desc">西里尔字母转写</span>
          </button>
        </div>

        <button id="run-transform" class="primary-action" type="button">
          <span class="play-icon">▶</span>
          <span class="spinner" aria-hidden="true"></span>
          <span id="run-label">转写</span>
        </button>

        <button id="swap-text" class="swap-action" type="button" aria-label="交换输入输出">⇄</button>
      </section>

      <section class="text-panel output-panel">
        <div class="panel-head">
          <div>
            <span class="eyebrow">输出</span>
            <h1>转写结果</h1>
          </div>
          <div class="output-tools">
            <button id="copy-output" class="tool-button" type="button">复制</button>
            <div class="menu-wrap">
              <button id="download-menu" class="tool-button" type="button" aria-expanded="false">下载 ▾</button>
              <div id="download-options" class="download-options" hidden>
                <button type="button" data-download="txt">.txt</button>
                <button type="button" data-download="json">.json</button>
              </div>
            </div>
          </div>
        </div>
        <div id="output-text" class="output-box empty">转写结果将在此显示</div>
        <div class="panel-foot">
          <span id="output-count" class="count">0 字符</span>
        </div>
      </section>
    </main>

    <div id="error-banner" class="error-banner" hidden></div>

    <footer class="statusbar">
      <span id="pill" class="pill">就绪</span>
      <span id="last-run">上次运行: --</span>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="./renderer.js"></script>
</body>
</html>
