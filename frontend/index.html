<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lacinka</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="window" data-theme="light">
    <header class="titlebar">
      <div class="brand">
        <div class="brand-avatar"></div>
        <div class="brand-text">
          <div class="brand-title">Łacinka</div>
          <div class="brand-subtitle" data-i18n="brandSubtitle"></div>
        </div>
      </div>

      <div class="header-status">
        <span class="status-dot"></span>
        <span id="status-text" data-i18n="statusWaiting"></span>
      </div>

      <div class="title-actions">
        <button id="lang-toggle" class="lang-toggle" type="button" data-i18n-aria-label="langToggle" data-i18n-title="langToggle"><span data-i18n="langLabel"></span></button>
        <button id="theme-toggle" class="icon-button" type="button" data-i18n-aria-label="themeToggle" data-i18n-title="themeToggle">◐</button>
        <label class="pin-toggle">
          <input id="always-on-top" type="checkbox">
          <span data-i18n="alwaysOnTop"></span>
        </label>
        <button id="clear-all" class="icon-button danger-hover" type="button" data-i18n-aria-label="clearAll" data-i18n-title="clearAll">⌫</button>
        <button id="btn-minimize" class="icon-button" type="button" data-i18n-aria-label="minimize">_</button>
        <button id="btn-maximize" class="icon-button" type="button" data-i18n-aria-label="maximize">□</button>
        <button id="btn-close" class="icon-button danger" type="button" data-i18n-aria-label="close">×</button>
      </div>
    </header>

    <main class="workspace">
      <section class="text-panel input-panel">
        <div class="panel-head">
          <div>
            <span class="eyebrow" data-i18n="inputEyebrow"></span>
            <h1 data-i18n="inputTitle"></h1>
          </div>
          <span id="input-count" class="count" data-i18n="countZero"></span>
        </div>
        <textarea id="input-text" spellcheck="false" data-i18n-placeholder="inputPlaceholder"></textarea>
        <div class="meter" aria-hidden="true"><span id="input-meter"></span></div>
        <div class="chips">
          <button id="insert-sample" class="chip" type="button" data-i18n="insertSample"></button>
        </div>
      </section>

      <section class="control-panel">
        <div class="mode-stack" data-i18n-aria-label="transformType">
          <button class="group-button active" type="button" data-group="1">
            <span class="group-name" data-i18n="group1Name"></span>
            <span class="group-selected" data-selected-mode="1"></span>
          </button>
          <button class="group-button" type="button" data-group="2">
            <span class="group-name" data-i18n="group2Name"></span>
            <span class="group-selected" data-selected-mode="2"></span>
          </button>
          <button class="group-button" type="button" data-group="3">
            <span class="group-name" data-i18n="group3Name"></span>
            <span class="group-selected" data-selected-mode="3"></span>
          </button>
          <button class="group-button" type="button" data-group="4">
            <span class="group-name" data-i18n="group4Name"></span>
            <span class="group-selected" data-selected-mode="4"></span>
          </button>
        </div>

        <button id="run-transform" class="primary-action" type="button">
          <span class="play-icon">▶</span>
          <span class="spinner" aria-hidden="true"></span>
          <span id="run-label" data-i18n="runButton"></span>
        </button>

        <button id="swap-text" class="swap-action" type="button" data-i18n-aria-label="swapText">⇄</button>
      </section>

      <section class="text-panel output-panel">
        <div class="panel-head">
          <div>
            <span class="eyebrow" data-i18n="outputEyebrow"></span>
            <h1 data-i18n="outputTitle"></h1>
          </div>
          <div class="output-tools">
            <button id="copy-output" class="tool-button" type="button" data-i18n="copyOutput"></button>
            <div class="menu-wrap">
              <button id="download-menu" class="tool-button" type="button" aria-expanded="false" data-i18n="downloadMenu"></button>
              <div id="download-options" class="download-options" hidden>
                <button type="button" data-download="txt">.txt</button>
                <button type="button" data-download="json">.json</button>
              </div>
            </div>
          </div>
        </div>
        <div id="output-text" class="output-box empty" data-i18n="emptyOutput"></div>
        <div class="panel-foot">
          <span id="output-count" class="count" data-i18n="countZero"></span>
        </div>
      </section>
    </main>

    <div id="error-banner" class="error-banner" hidden></div>

    <div id="mode-popup" class="popup-overlay" hidden>
      <div class="popup-panel" role="dialog" aria-modal="true" data-i18n-aria-label="transformType">
        <div id="popup-mode-list" class="popup-mode-list" role="radiogroup" data-i18n-aria-label="transformType"></div>
      </div>
    </div>

    <footer class="statusbar">
      <span id="last-run"></span>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="../core/common/Common.js"></script>
  <script src="./i18n/zh-CN.js"></script>
  <script src="./i18n/en.js"></script>
  <script src="./renderer.js"></script>
</body>
</html>
